<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="description" content="하남점 사진·구역·검색 커뮤니티 v0.6 비공식 모바일 테스트">
<title>하남점 커뮤니티 · v0.6 공유형 준비 미리보기</title>
<style>
:root{--blue:#005DAA;--navy:#092c59;--red:#e31837;--ink:#192d44;--muted:#647489;--pale:#f1f5fa;--line:#e4eaf1;--shadow:0 7px 22px #15335511}
*{box-sizing:border-box}html{background:#e9eff5}body{margin:0;color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #70aeff;outline-offset:2px}a{color:inherit}
.app{max-width:480px;min-height:100dvh;background:#f7f9fc;margin:auto;box-shadow:0 0 40px #1234;position:relative}.head{position:sticky;top:0;z-index:15;background:linear-gradient(115deg,#083f85,#005DAA);padding:calc(12px + env(safe-area-inset-top)) 18px 13px;color:white;border-bottom:4px solid var(--red)}.head small{display:block;font-size:10px;letter-spacing:.05em;opacity:.87}.head h1{font-size:20px;margin:3px 0;font-weight:850;letter-spacing:-.7px}.head p{margin:0;font-size:11px;color:#dae8f9}.head .mini{position:absolute;right:18px;top:calc(22px + env(safe-area-inset-top));border:1px solid #ffffff70;background:#ffffff1b;padding:7px 9px;border-radius:8px;font-size:10px}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}.banner{margin:14px 15px 8px;border-radius:12px;padding:11px 13px;background:#fff6e8;color:#785127;line-height:1.55;font-size:11px;border:1px solid #f4dfbf}.banner.ready{background:#edf8f3;color:#13644b;border-color:#caecdd}
.searchbox{padding:13px 15px 5px;display:flex;gap:9px}.searchbox label{display:flex;gap:8px;align-items:center;background:white;border:1px solid #d7dfea;border-radius:13px;flex:1;padding:11px 12px;box-shadow:var(--shadow)}.searchbox input{min-width:0;width:100%;border:0;outline:0;font-size:13px}.filter-btn{background:#e3eeff;border:0;border-radius:13px;padding:10px 12px;color:#174c8a;font-size:19px}.quick{display:flex;overflow:auto;gap:7px;padding:6px 15px 10px;scrollbar-width:none}.quick button,.sort button,.zone-pills button{border:0;white-space:nowrap;border-radius:25px;background:#e7f0ff;color:#19457c;padding:8px 12px;font-size:12px;font-weight:650}.heading{display:flex;align-items:center;justify-content:space-between;padding:15px 15px 11px}.heading h2{font-size:17px;letter-spacing:-.5px;margin:0}.heading button{border:0;background:transparent;color:var(--blue);font-size:11px}.zones{display:flex;overflow:auto;gap:9px;padding:0 15px 10px;scrollbar-width:none}.zone{flex:0 0 103px;border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden;text-align:center;box-shadow:var(--shadow);padding:0}.zone.sel{border:2px solid var(--red)}.zone .visual{height:84px;position:relative;background:linear-gradient(135deg,#f3f6fc,#d6e3f0);display:flex;align-items:center;justify-content:center;font-size:39px}.zone .visual b{position:absolute;top:3px;left:9px;color:var(--navy);font-size:22px;text-shadow:0 1px 0 white}.zone .name{display:block;padding:9px 2px;font-size:11px;font-weight:750}.sort{display:flex;gap:7px;overflow:auto;padding:4px 15px 8px}.sort button{background:#edf0f6;color:#47576e}.sort button.sel{background:var(--red);color:#fff}.zone-pills{padding:0 15px 8px;display:flex;gap:6px;overflow:auto}.zone-pills button.sel{background:var(--blue);color:white}.popular{display:flex;gap:8px;overflow:auto;padding:0 15px 13px}.popular button{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:13px;background:white;padding:11px 10px;white-space:nowrap;font-size:12px;box-shadow:var(--shadow)}.popular i{font-style:normal;font-size:22px}
.posts{padding:0 13px;display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:14px;background:white;box-shadow:var(--shadow);overflow:hidden}.photo-card{display:grid;grid-template-columns:42% 1fr;min-height:148px}.card .thumb{border:0;position:relative;background:linear-gradient(145deg,#dce7f4,#fff3dd);display:flex;align-items:center;justify-content:center;font-size:49px;min-height:148px;width:100%;padding:0}.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.thumb .spot{position:absolute;left:7px;top:8px;background:#111c2ccc;color:white;font-size:10px;padding:4px 7px;border-radius:9px}.detail{padding:13px 12px;min-width:0}.detail h3{font-size:14px;margin:0 0 6px;line-height:1.4}.detail p{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.55;overflow-wrap:anywhere}.pill{display:inline-block;font-size:10px;padding:4px 7px;border-radius:8px;background:#e6f0ff;color:var(--blue);font-weight:700}.meta{display:flex;gap:9px;flex-wrap:wrap;color:#8190a3;font-size:10px;margin-top:11px}.story{padding:15px}.story h3{font-size:15px;margin:6px 0}.story p{font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.6}.story .actions{display:flex;gap:10px;margin:12px 0 0}.story .actions button,.more{border:1px solid #dfe6ef;background:#f7faff;border-radius:9px;padding:7px 10px;font-size:11px;color:#234e78}.muted{color:var(--muted)}.empty{border-radius:14px;background:white;border:1px dashed #d9e3ed;padding:35px 24px;text-align:center;color:#617188;font-size:13px;margin:0 14px}.empty strong{display:block;font-size:16px;color:#1a3554;margin-bottom:8px}.empty .symbol{font-size:35px;display:block;margin-bottom:10px}.explain{font-size:11px;line-height:1.6;color:#667789;padding:15px 18px}.panel{margin:15px;padding:20px 17px;background:white;border-radius:14px;border:1px solid var(--line)}.panel h2{font-size:19px;margin:0 0 10px}.panel p{font-size:12px;line-height:1.8;color:#5c6a7c}.panel button,.primary{border:0;background:var(--blue);color:#fff;padding:11px 14px;border-radius:10px;font-weight:700}.panel .secondary,.secondary{background:#f0f4f9;color:var(--ink);border:1px solid #dce4ef;padding:10px 12px;border-radius:10px}.panel .buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.bottom{height:calc(68px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:15;background:white;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:none;color:#6c7788;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:10px}.bottom button .symbol{font-size:22px}.bottom button.current{color:var(--blue);font-weight:750}.bottom button.add .symbol{font-size:29px;background:var(--red);color:white;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;line-height:1}
.scrim{position:fixed;inset:0;background:#061625b8;z-index:25;display:none;align-items:end;justify-content:center}.scrim.open{display:flex}.sheet{background:white;width:min(480px,100%);max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 17px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -7px 30px #0002}.sheet .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:13px}.sheet h2{font-size:18px;margin:0}.sheet .close{border:0;background:#f2f5fa;border-radius:50%;width:34px;height:34px;font-size:20px}.sheet label.field{display:block;font-size:12px;font-weight:700;margin:12px 0}.sheet input:not([type=checkbox]),.sheet textarea,.sheet select{margin-top:6px;border:1px solid #cbd7e6;border-radius:10px;width:100%;padding:11px 12px;background:#fff;font-size:13px}.sheet textarea{min-height:85px;resize:vertical}.sheet .wide{width:100%;margin-top:13px}.forminfo{font-size:11px;color:#697992;line-height:1.5}.status{font-size:11px;color:#9d5b28}.notice{color:#a34539}.modal-photo{max-width:100%;max-height:45dvh;object-fit:contain;display:block;margin:auto}.modal-photo-area{display:flex;align-items:center;justify-content:center;min-height:220px;background:#131c2b;color:white}.photo-controls{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:max-content;max-width:90%;padding:10px 14px;background:#1a2b40;color:white;z-index:35;border-radius:11px;box-shadow:0 4px 16px #1115;display:none;font-size:12px}.toast.show{display:block}
@media(min-width:550px){.bottom{border-radius:12px}.app{border-radius:0 0 18px 18px}}@media(max-width:360px){.photo-card{grid-template-columns:40% 1fr}.zone{flex-basis:91px}.head h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><small>HANAM COMMUNITY · v0.6</small><h1>하남점 커뮤니티</h1><p>사진으로 보는 오늘의 매장</p><span class="mini">비공식 테스트</span></header>
<main id="main" aria-live="polite"></main>
<nav class="bottom" aria-label="하단 메뉴">
<button data-tab="home" class="current"><span class="symbol">⌂</span>홈</button>
<button data-tab="zones"><span class="symbol">▧</span>구역</button>
<button data-tab="compose" class="add"><span class="symbol">＋</span>올리기</button>
<button data-tab="stories"><span class="symbol">♧</span>이웃</button>
<button data-tab="profile"><span class="symbol">♙</span>내 정보</button>
</nav>
</div>
<div class="scrim" id="scrim" role="presentation"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세 및 입력 화면"></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>

</html>
