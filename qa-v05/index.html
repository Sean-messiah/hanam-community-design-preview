.masthead-inner{min-height:83px;background:linear-gradient(90deg,#005daa 0%,#005daa 47%,rgba(0,93,170,.58) 75%,rgba(0,93,170,.02));padding:13px 16px;align-items:center}
.brand strong{font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-.7px}
.brand small{display:block;letter-spacing:0;margin-top:3px;font-size:11px;font-weight:500;color:#dcecff}
.topbadge{border-color:rgba(255,255,255,.5);color:#fff;background:#003d7580;font-size:9px;max-width:75px;white-space:normal;text-align:center}
.redbar{height:4px;background:#e31837}
.search-area{background:white;padding:14px 14px 8px}
#productSearchForm{display:flex;gap:9px;align-items:stretch}
.search-field{display:flex;align-items:center;flex:1;min-width:0;gap:10px;background:#f6f8fc;border:1px solid #d8e0eb;border-radius:13px;height:47px;padding:0 12px;color:#162946;box-shadow:0 2px 8px rgba(8,35,68,.05)}
.search-field input{width:100%;min-width:0;border:0;background:none;font-size:13px;outline:none!important;color:#243047}
.search-field input::placeholder{color:#7b879c}
.search-field input::-webkit-search-cancel-button{display:none}
.search-clear{border:0;background:#e4ebf6;border-radius:50%;width:21px;height:21px;padding:0;color:#3e5679}
.search-filter-btn{width:47px;height:47px;display:grid;place-items:center;border:0;border-radius:13px;background:#dceaff;color:#005daa}
.quick-keywords{display:flex;gap:7px;overflow:auto;padding:11px 0 6px;scrollbar-width:none}
.quick-keywords button{white-space:nowrap;flex:none;border:0;border-radius:100px;background:#ebf2fe;color:#16416f;font-weight:720;font-size:11px;min-height:31px;padding:5px 13px}
.quick-keywords button.on{background:#005daa;color:#fff}
.zone-explore{padding:8px 0 0;background:#fff}
.home-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px;margin:9px 0 13px}
.home-section-title h2{margin:0;font-size:18px;letter-spacing:-.65px;color:#14243f;font-weight:850}
.home-section-title button{color:#42536e;background:none;border:0;font-size:11px;font-weight:700;white-space:nowrap}
.tag-detail{font-size:11px;color:#728094}
.zone-photo-list{display:flex;gap:8px;overflow-x:auto;padding:1px 14px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.zone-photo-list::-webkit-scrollbar,.quick-keywords::-webkit-scrollbar,.popular-products::-webkit-scrollbar{display:none}
.zone-photo-card{flex:0 0 108px;overflow:hidden;background:#fff;border:1.5px solid #e0e5ed;border-radius:11px;padding:0;color:#122341;box-shadow:0 3px 9px rgba(0,0,0,.05);scroll-snap-align:start;text-align:center}
.zone-photo-card.selected{border:2px solid #e31837;background:#fff8f9}
.zone-photo-img{height:85px;background:#eef3fa;display:block;position:relative;overflow:hidden}
.zone-photo-img img{width:100%;height:100%;object-fit:cover;display:block}
.zone-big-letter{position:absolute;top:4px;left:7px;font-weight:900;font-size:20px;color:#fff;text-shadow:0 1px 4px #1b263dd0}
.zone-photo-card.selected .zone-big-letter{color:#e31837;text-shadow:none}
.zone-photo-name{display:block;font-size:11px;font-weight:800;padding:10px 1px;white-space:nowrap;letter-spacing:-.5px}
.zone-emoji{display:grid;place-items:center;font-size:40px;width:100%;height:100%}
.sort-section{background:#fff;padding:3px 14px 11px}
.sort-controls{display:flex;overflow:auto;gap:7px;scrollbar-width:none}
.sort-pill{border:0;border-radius:50px;white-space:nowrap;padding:8px 15px;color:#46526b;background:#f0f3f9;font-weight:700;font-size:11px;min-height:34px}
.sort-pill.selected{background:#e31837;color:#fff}
.sort-section .spot-bar{margin:10px 0 0}
.popular-section{padding:9px 0 6px;background:#fff;margin-top:8px}
.popular-products{display:flex;gap:8px;overflow:auto;padding:0 14px 10px;scrollbar-width:none}
.popular-products button{border:1px solid #e4e9f1;border-radius:11px;background:#fff;min-width:105px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 7px #1425410b;font-size:12px;font-weight:800;white-space:nowrap;padding:8px 10px}
.popular-icon{font-size:25px}
.main-feed-section{padding:8px 0 0;background:#f8f9fb}
.main-feed-section .home-section-title{margin-top:15px;margin-bottom:12px}
.sample-notice{padding:0 14px;margin:0 0 8px;color:#7c889a;font-size:10px;line-height:1.45}
.feed-results{display:grid;gap:9px;padding:0 12px 16px}
.photo-feed-card{display:flex;background:#fff;border-radius:13px;overflow:hidden;border:1px solid #e9edf4;min-height:153px;box-shadow:0 4px 15px #1427460a}
.feed-cover{position:relative;width:43%;flex:0 0 43%;min-height:153px;border:0;padding:0;background:#eff3f6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.feed-cover img{display:block;width:100%;height:100%;max-height:160px;object-fit:contain}
.feed-spot{position:absolute;top:8px;left:8px;border-radius:15px;color:#fff;background:#142435cb;padding:4px 9px;font-size:11px;font-weight:800}
.feed-imgcount{position:absolute;bottom:8px;right:7px;background:#111b2cdb;padding:3px 7px;color:#fff;border-radius:6px;font-size:10px}
.feed-demo-label{position:absolute;left:7px;bottom:8px;color:white;background:#234363b3;padding:3px 5px;font-size:9px;border-radius:5px}
.feed-copy{padding:11px 10px 9px;min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.feed-copy-top{display:flex;align-items:start;justify-content:space-between;width:100%;gap:3px}
.feed-title{font-size:14px;font-weight:850;line-height:1.4;text-align:left;background:none;border:0;padding:0;color:#182333;letter-spacing:-.4px}
.feed-more{border:0;background:transparent;color:#657386;font-weight:900;font-size:15px;padding:0 1px}
.feed-copy p{color:#667082;font-size:11px;line-height:1.45;margin:5px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.feed-zonebadge{color:#005daa;background:#eaf2ff;font-weight:800;font-size:10px;border-radius:14px;padding:4px 8px}
.feed-meta{margin-top:auto;padding-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:10px;color:#8190a2}
.no-results{margin:12px 0 24px;padding:25px 15px;text-align:center;background:#fff;border-radius:15px}
.no-results b{font-size:15px}
.no-results p{color:#728094;font-size:12px;line-height:1.6}
.no-results button{font-size:12px;margin:5px}
.home-bottom-notice{padding:4px 18px 20px;font-size:10px;line-height:1.65;color:#8491a4}
.bottom-nav{box-shadow:0 -3px 16px rgba(21,42,79,.09);background:#fff}
.bottom-nav .nav-add{background:transparent!important;color:#283c57!important;box-shadow:none!important;border-radius:0!important;flex-direction:column;gap:3px;font-size:10px!important;padding:0!important;min-width:50px}

.bottom-nav .nav-item{font-size:10px!important;gap:3px;min-width:0}
.bottom-nav .nav-item span{font-size:10px}
@media(max-width:365px){.zone-photo-card{flex-basis:98px}.feed-cover{width:40%;flex-basis:40%}.feed-title{font-size:12px}.feed-meta{gap:6px;font-size:9px}}

 {id:'demoB',kind:'photo',isDemo:true,zone:'B',spot:'B-01',title:'오늘 베이커리 진열',text:'크루아상, 소금빵 등 베이커리 코너 디자인 예시',createdAt:0,src:DESIGN_ASSETS.feedB,files:[{}]},

 {id:'demoE',kind:'photo',isDemo:true,zone:'E',spot:'E-01',title:'세제 코너 사진 예시',text:'생활용품 코너의 가상 게시물입니다.',createdAt:0,src:DESIGN_ASSETS.feedE,files:[{}]}
];
function toast(message){let t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>t.classList.remove('show'),4200)}
function route(next,push=true){if(overlayBackPending)return;ui={...ui,...next};if(push){try{history.pushState({hanam:true,...ui},'',location.href)}catch{}}render();if(next.page||next.overlay)window.scrollTo(0,0)}
function nav(page){if(ui.overlay){closeOverlay();return}route({page,overlay:null,spot:'ALL',...(page==='feed'?{}:{zone:'ALL'})})}
function openOverlay(type,id){focusBefore=document.activeElement;activeId=id||'';picIndex=0;zoom=1;route({overlay:type});setTimeout(()=>$('#sheet .close')?.focus(),20)}
function closeOverlay(){
 if(!ui.overlay||overlayBackPending)return;
 if(history.state?.hanam&&history.state.overlay&&history.length>1){
   overlayBackPending=true;
   // One back action at a time: repeated taps must not exit the site.
   history.back();
 }else{route({overlay:null},false);focusBefore?.focus?.()}
}
window.addEventListener('popstate',e=>{
 overlayBackPending=false;
 const s=e.state;
 ui=s?.hanam?{page:s.page||'feed',zone:s.zone||'ALL',spot:s.spot||'ALL',overlay:s.overlay||null}:{page:'feed',zone:'ALL',spot:'ALL',overlay:null};
 render();if(!ui.overlay){focusBefore?.focus?.({preventScroll:true});focusBefore=null}
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.overlay){e.preventDefault();closeOverlay()}});
function photoURL(file){if(!file)return '';if(!(file instanceof Blob))return '';if(!urlCache.has(file)){const u=URL.createObjectURL(file);trackedURLs.add(u);urlCache.set(file,u)}return urlCache.get(file)}
const photoPosts=()=>posts.filter(p=>p.kind==='photo');const stories=()=>posts.filter(p=>p.kind==='story');
const filterPhotos=()=>{
  const q=searchQuery.trim().toLocaleLowerCase('ko-KR');
  const filtered=photoPosts().filter(p=>(ui.zone==='ALL'||p.zone===ui.zone)&&(ui.spot==='ALL'||p.spot===ui.spot)&&(!q||[p.title,p.text,p.zone,p.spot,zoneLabel(p.zone)].some(v=>String(v||'').toLocaleLowerCase('ko-KR').includes(q))));
  if(sortMode==='popular')return filtered.sort((a,b)=>(b.comments?.length||0)-(a.comments?.length||0)||(b.createdAt||0)-(a.createdAt||0));
  return filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
};
function visibleFeed(){
  const actual=filterPhotos();
  if(photoPosts().length||sortMode==='photo')return actual;
  const q=searchQuery.trim().toLocaleLowerCase('ko-KR');
  let samples=demo.filter(p=>(ui.zone==='ALL'||p.zone===ui.zone)&&(ui.spot==='ALL'||p.spot===ui.spot)&&(!q||[p.title,p.text,p.zone,p.spot,zoneLabel(p.zone)].some(v=>String(v||'').toLocaleLowerCase('ko-KR').includes(q))));
  return samples;
}
function feedResultsHTML(){const shown=visibleFeed();return shown.length?shown.map(card).join(''):`<div class="no-results"><b>검색된 사진이 없습니다.</b><p>다른 상품명 또는 구역으로 검색하거나 첫 사진을 등록해 보세요.</p><button type="button" class="primary blue" data-action="upload">사진 올리기</button>${searchQuery?'<button type="button" class="secondary" data-clear-search="1">검색 초기화</button>':''}</div>`}
function refreshFeedResults(){const box=$('#feedResults');if(box)box.innerHTML=feedResultsHTML()}
function setSearchTerm(q){searchQuery=String(q||'').slice(0,90);renderMain()}
function render(){renderNav();renderMain();renderOverlay()}
function renderNav(){$$('[data-nav]').forEach(el=>{el.classList.toggle('active',el.dataset.nav===ui.page);if(el.dataset.nav===ui.page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});document.body.classList.toggle('large-text',large)}
function chips(){return `<div class="filter-wrap"><div class="filters">${zonenames.map(z=>`<button type="button" class="filter ${ui.zone===z?'active':''}" data-zone="${z}" aria-pressed="${ui.zone===z}">${z==='ALL'?'모두 보기':z+' · '+zoneLabel(z)}</button>`).join('')}</div></div>${ui.zone!=='ALL'?`<div class="spot-bar"><span>촬영 스팟</span>${['ALL',ui.zone+'-01',ui.zone+'-02'].map(s=>`<button class="spot-chip ${ui.spot===s?'active':''}" type="button" data-spot="${s}">${s==='ALL'?'전체 스팟':s}</button>`).join('')}</div>`:''}`}
function card(p){let count=Array.isArray(p.files)?p.files.length:0;let src=p.isDemo?p.src:photoURL(p.files?.[0]);return `<article class="photo-feed-card"><button type="button" class="feed-cover" data-detail="${esc(p.id)}" aria-label="${esc(p.title||'사진')} 자세히 보기"><img src="${src}" alt="${esc(p.title||'사진')}" loading="lazy"/><span class="feed-spot">${esc(p.spot||p.zone+'구역')}</span><span class="feed-imgcount">▧ ${count}</span>${p.isDemo?'<span class="feed-demo-label">디자인 예시</span>':''}</button><div class="feed-copy"><div class="feed-copy-top"><button type="button" class="feed-title" data-detail="${esc(p.id)}">${esc(p.title||String(p.text||'사진').split('\n')[0])}</button><button type="button" class="feed-more" data-detail="${esc(p.id)}" aria-label="상세 보기">···</button></div><p>${esc(p.text||'사진 설명')}</p><span class="feed-zonebadge">${esc(p.zone)} · ${esc(zoneLabel(p.zone))}</span><div class="feed-meta"><span>◷ ${p.isDemo?'예시 이미지':time(p.createdAt)}</span><span>◯ ${(p.comments||[]).length} 댓글</span></div></div></article>`}

function openDB(name,version){return new Promise((res,rej)=>{const req=indexedDB.open(name,version);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function allFrom(database){return new Promise((res,rej)=>{const tx=database.transaction(STORE,'readonly');let rows=[];const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>rows=r.result||[];tx.oncomplete=()=>res(rows);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('조회 중단'))})}
function commitPost(p,overwrite=false){if(!storageReady||!db)return Promise.reject(new Error('기기 저장소를 준비하고 있습니다. 잠시 후 다시 시도해 주세요.'));return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');let store=tx.objectStore(STORE);(overwrite?store.put(p):store.add(p));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('저장 중단'))})}
function removePost(id){if(!storageReady||!db)return Promise.reject(new Error('저장소가 준비되지 않았습니다.'));return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('삭제 중단'))})}
function updatePost(id,mutate){
 if(!storageReady||!db)return Promise.reject(new Error('저장소가 준비되지 않았습니다.'));
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);
  const get=store.get(id);
  get.onsuccess=()=>{
   if(!get.result){tx.abort();return}
   try{store.put(mutate(get.result))}catch(e){tx.abort()}
  };
  tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('저장 실패'));
  tx.onabort=()=>reject(tx.error||new Error('다른 탭에서 이 게시물이 변경되거나 삭제되었습니다.'));
 });
}
async function reload(){posts=(await allFrom(db)).filter(p=>p.branchId===BRANCH&&['photo','story'].includes(p.kind)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render()}
async function migratePreview(){if(!('indexedDB' in window))return;let r;try{r=await new Promise((resolve,reject)=>{let q=indexedDB.open(PREVIEW_DB);q.onupgradeneeded=()=>q.transaction.abort();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}catch{return}if(!r.objectStoreNames.contains(STORE)){r.close();return}try{let old=await allFrom(r),existing=new Set((await allFrom(db)).map(p=>p.id));for(const p of old){const id='preview-'+p.id;if(existing.has(id))continue;if(!p.blob||!ZONES.some(([z])=>z===p.zone))continue;const file=new File([p.blob],p.blob.name||'preview-photo',{type:p.blob.type||'image/jpeg',lastModified:p.blob.lastModified||Date.now()});await commitPost({id,branchId:BRANCH,kind:'photo',zone:p.zone,spot:spotValid(p.zone,p.spot)?p.spot:p.zone+'-01',title:String(p.title||'').slice(0,70),text:String(p.text||'').slice(0,800),createdAt:p.created||Date.now(),files:[file],comments:[],classificationHistory:[],originPreview:true});existing.add(id)}}finally{r.close()}}
async function exportData(){if(!storageReady||!db)throw Error('기기 저장소를 준비 중입니다.');const records=(await allFrom(db)).filter(p=>p.branchId===BRANCH&&['photo','story'].includes(p.kind));const rows=[];for(const p of records){let files=[];for(const f of (p.files||[])){if(!(f instanceof Blob))continue;const data=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(f)});files.push({name:f.name||'photo',type:f.type||'image/jpeg',lastModified:f.lastModified||Date.now(),data})}rows.push({...p,files})}const blob=new Blob([JSON.stringify({format:'market-neighbor-v1',branchId:BRANCH,exportedAt:Date.now(),posts:rows})],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`hanam-backup-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(`게시물 ${rows.length}개의 백업을 저장했습니다.`)}
function validDate(t){return Number.isFinite(+t)&&+t>0&&+t<4102444800000}
async function importData(file){
if(!storageReady||!db)throw Error('기기 저장소를 준비 중입니다.');
if(file.size>200*1024*1024)throw Error('백업 파일이 너무 큽니다.');
const data=JSON.parse(await file.text());
if(data.branchId!==BRANCH||!Array.isArray(data.posts)||data.format!=='market-neighbor-v1')throw Error('하남점 백업 형식(v0.1/v0.2 호환형)이 아닙니다.');
if(data.posts.length>500)throw Error('최대 500개의 게시물만 가져올 수 있습니다.');
const existing=new Set((await allFrom(db)).map(p=>p.id)),ready=[];
// Parse and validate every item before writing any new data.
for(const row of data.posts){
  if(!row||!['photo','story'].includes(row.kind)||typeof row.id!=='string'||!row.id||!validDate(row.createdAt))throw Error('백업에 잘못된 게시물이 포함되어 있습니다.');
  if(row.branchId&&row.branchId!==BRANCH)throw Error('다른 지점의 게시물은 가져올 수 없습니다.');
  const zone=row.kind==='photo'?(typeof row.zone==='string'&&row.zone?row.zone:'A'):null;
  const spot=row.kind==='photo'?(typeof row.spot==='string'&&row.spot?row.spot:zone+'-01'):null;
  if(row.kind==='photo'&&zoneMap[zone]&&spot&&/^[A-J]-\d{2}$/.test(spot)&&!spotValid(zone,spot))throw Error('다른 구역에 속한 스팟이 있습니다.');
  if(row.comments!==undefined&&(!Array.isArray(row.comments)||row.comments.some(c=>!c||typeof c.body!=='string'||!validDate(c.at))))throw Error('잘못된 댓글이 포함되어 있습니다.');
  let files=[];
  if(row.kind==='photo'){
    if(!Array.isArray(row.files)||row.files.length<1||row.files.length>10)throw Error('사진 개수가 올바르지 않습니다.');
    for(const f of row.files){
      if(!f||typeof f.data!=='string'||!/^data:image\/(jpeg|png|webp|heic|heif);base64,/i.test(f.data))throw Error('손상되었거나 지원되지 않는 사진이 있습니다.');
      const blob=await(await fetch(f.data)).blob();if(blob.size>20*1024*1024)throw Error('20MB 초과 사진이 있습니다.');
      files.push(new File([blob],String(f.name||'photo').slice(0,120),{type:blob.type,lastModified:validDate(f.lastModified)?Number(f.lastModified):Date.now()}));
    }
  }
  const rec={...row,id:row.id,branchId:BRANCH,zone,spot,comments:Array.isArray(row.comments)?row.comments:[],files,classificationHistory:Array.isArray(row.classificationHistory)?row.classificationHistory:[]};
  while(existing.has(rec.id))rec.id='copy-'+uid();existing.add(rec.id);ready.push(rec);
}
// One IndexedDB transaction ensures an invalid/failed write never leaves a partial import.
if(ready.length)await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite');const store=tx.objectStore(STORE);
  for(const r of ready)store.add(r);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('복원이 중단되었습니다.'));
});
await reload();toast(`백업 ${ready.length}개를 기존 데이터에 추가했습니다. (덮어쓰기 없음)`);
}
async function addPost(form,kind){const data=new FormData(form),title=String(data.get('title')||'').trim().slice(0,70),text=String(data.get('memo')||'').trim().slice(0,800),zone=String(data.get('zone')||'A'),spot=String(data.get('spot')||'A-01');if(!title||kind==='story'&&!text)throw Error('제목과 내용을 확인해 주세요.');if(kind==='photo'&&(!selectedFiles.length||selectedFiles.length>10||!spotValid(zone,spot)))throw Error('사진과 스팟을 확인해 주세요.');if(!data.get('rights'))throw Error('게시 권한을 확인해 주세요.');let p={id:uid(),branchId:BRANCH,kind,title,text,zone:kind==='photo'?zone:null,spot:kind==='photo'?spot:null,createdAt:Date.now(),comments:[],files:kind==='photo'?[...selectedFiles]:[],classificationHistory:[]};await commitPost(p);await reload();closeOverlay();toast('현재 브라우저에 저장했습니다.');if(kind==='story'){setTimeout(()=>route({page:'stories',zone:'ALL',spot:'ALL',overlay:null}),60)}}
async function editClassification(form){
 const p=posts.find(p=>p.id===activeId);if(!p)throw Error('게시물을 찾을 수 없습니다.');
 const data=new FormData(form),z=String(data.get('zone')),s=String(data.get('spot'));
 if(!spotValid(z,s))throw Error('선택한 구역의 스팟을 지정해 주세요.');
 if(p.zone!==z||p.spot!==s){
  await updatePost(activeId,latest=>({...latest,zone:z,spot:s,classificationHistory:[...(latest.classificationHistory||[]),{fromZone:latest.zone,fromSpot:latest.spot,toZone:z,toSpot:s,at:Date.now()}]}));
  closeOverlay();await reload();
 }else closeOverlay();
 toast('분류가 저장되었습니다. 사진 원본은 그대로입니다.');
}
async function handleAction(action){if(action==='upload'||action==='story'){openOverlay(action==='story'?'story':'upload');return}if(action==='close'){closeOverlay();return}if(action==='prev'||action==='next'){const p=posts.find(x=>x.id===activeId)||demo.find(x=>x.id===activeId);if(p){picIndex=Math.min(Math.max(0,picIndex+(action==='next'?1:-1)),p.files.length-1);zoom=1;renderOverlay()}return}if(action==='zoom-in'||action==='zoom-out'){zoom=Math.min(3,Math.max(1,Math.round((zoom+(action==='zoom-in'?.5:-.5))*10)/10));renderOverlay();return}if(action==='classify'){route({overlay:'classify'});return}if(action==='delete'){if(!confirm('이 기기에서 사진 게시물을 삭제할까요?'))return;await removePost(activeId);closeOverlay();await reload();toast('삭제했습니다.');return}if(action==='focus-sort'){document.querySelector('#sortSection')?.scrollIntoView({behavior:'smooth',block:'center'});return}if(action==='export'){await exportData();return}if(action==='import'){$('#importFile')?.click();return}if(action==='text-size'){large=!large;try{localStorage.setItem('hanam-large-text',large?'1':'0')}catch{}render();return}if(action==='speak'){if(!('speechSynthesis' in window)){toast('현재 브라우저에서 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance('하남점 커뮤니티입니다. 사진 피드에서 전체 또는 A부터 J 구역을 선택할 수 있습니다. 구역 보기에는 20개 임시 촬영 스팟이 있습니다. 하단 버튼에서 사진과 이야기를 등록하세요. 데이터는 이 기기에 보관됩니다.');utt.lang='ko-KR';utt.rate=.85;speechSynthesis.speak(utt)}}
$('#app').addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;try{if(btn.dataset.nav){nav(btn.dataset.nav);return}if(btn.dataset.search){setSearchTerm(btn.dataset.search);return}if(btn.dataset.clearSearch){setSearchTerm('');return}if(btn.dataset.sort){sortMode=btn.dataset.sort;renderMain();return}if(btn.dataset.zone){route({page:'feed',zone:btn.dataset.zone,spot:'ALL'});return}if(btn.dataset.zoneGo){route({page:'feed',zone:btn.dataset.zoneGo,spot:'ALL'});return}if(btn.dataset.spot){route({spot:btn.dataset.spot});return}if(btn.dataset.detail){openOverlay('detail',btn.dataset.detail);return}if(btn.dataset.comments){$('#comments-'+CSS.escape(btn.dataset.comments))?.classList.toggle('hidden');return}if(btn.dataset.storyDelete){if(!confirm('이 브라우저의 이웃 이야기를 삭제할까요?'))return;await removePost(btn.dataset.storyDelete);await reload();toast('이야기를 삭제했습니다.');return}if(btn.dataset.action)await handleAction(btn.dataset.action)}catch(err){console.error(err);toast(err.message||'동작 중 오류가 발생했습니다.')}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeOverlay()});
let swipeStart=null;
$('#overlay').addEventListener('touchstart',e=>{
 if(ui.overlay!=='detail'||e.touches.length!==1||zoom!==1||!e.target.closest('.detail-stage')){swipeStart=null;return}
 swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
$('#overlay').addEventListener('touchend',e=>{
 if(!swipeStart||ui.overlay!=='detail'||zoom!==1||!e.changedTouches.length)return;
 const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;
 swipeStart=null;
 if(Math.abs(dx)>65&&Math.abs(dy)<45)handleAction(dx<0?'next':'prev');
},{passive:true});
$('#overlay').addEventListener('change',e=>{if(e.target.id==='files')handleFileChange(e.target);if(e.target.id==='zone')fillSpotOptions()});
$('#overlay').addEventListener('submit',async e=>{if(!['uploadForm','classForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,btn=form.querySelector('[type=submit]');btn.disabled=true;try{if(form.id==='classForm')await editClassification(form);else await addPost(form,ui.overlay)}catch(err){console.error(err);let box=$('#formError');if(box)box.textContent=err?.name==='QuotaExceededError'?'저장 공간이 부족합니다. 내 정보에서 데이터를 백업하고 기기 저장 공간을 확인해 주세요.':(err.message||'저장하지 못했습니다.');btn.disabled=false}});
$('#main').addEventListener('input',e=>{if(e.target.id==='productSearch'){searchQuery=e.target.value.slice(0,90);const clear=$('.search-clear');if(clear)clear.classList.toggle('hidden',!searchQuery);refreshFeedResults();}});
$('#main').addEventListener('submit',e=>{if(e.target.id==='productSearchForm'){e.preventDefault();searchQuery=($('#productSearch')?.value||'').slice(0,90);refreshFeedResults();}});
$('#main').addEventListener('submit',async e=>{let form=e.target.closest('[data-comment]');if(!form)return;e.preventDefault();const p=posts.find(p=>p.id===form.dataset.comment);if(!p)return;let text=String(new FormData(form).get('comment')||'').trim();if(!text)return;try{await updatePost(p.id,latest=>({...latest,comments:[...(latest.comments||[]),{body:text.slice(0,250),at:Date.now()}]}));await reload();$('#comments-'+CSS.escape(p.id))?.classList.remove('hidden');toast('댓글을 저장했습니다.')}catch(err){toast(err.message||'댓글 저장 실패')}});
$('#main').addEventListener('change',e=>{if(e.target.id==='importFile'){let f=e.target.files?.[0];if(!f)return;e.target.value='';if(!confirm('백업 파일의 게시물을 현재 기기에 추가합니다. 같은 ID의 게시물은 사본으로 보존합니다. 진행할까요?'))return;importData(f).catch(err=>toast('백업 오류: '+err.message))}});
window.addEventListener('beforeunload',()=>{for(const u of trackedURLs)URL.revokeObjectURL(u)});
try{large=localStorage.getItem('hanam-large-text')==='1'}catch{}
try{history.replaceState({hanam:true,...ui},'',location.href)}catch{}
render();(async()=>{try{db=await openDB(OLD_DB,1);storageReady=true;await migratePreview();await reload()}catch(err){console.error(err);toast('기기 저장소에 접근할 수 없습니다. Chrome 또는 삼성 인터넷을 확인해 주세요.')}})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

// Developer regression tests: QA-only path, isolated IndexedDB name, never production/user database.
if(location.pathname.includes('/qa-v05/')&&new URLSearchParams(location.search).has('e2e')){
 (async()=>{
   const results=[];const log=(name,ok,message='')=>results.push({name,ok,message});
   const assert=(v,m)=>{if(!v)throw Error(m)};
   const sampleId='qa-v05-'+Date.now();let ids=[];
   function sha(buffer){return crypto.subtle.digest('SHA-256',buffer).then(b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''))}
   function saveReport(){
    const div=document.createElement('div');div.id='qa-results';div.style='background:white;padding:20px;white-space:pre-wrap;border:2px solid navy;margin:20px;';
    div.innerText='v0.5 격리 QA ('+results.filter(r=>r.ok).length+'/'+results.length+' PASS)\n'+results.map(r=>(r.ok?'PASS ':'FAIL ')+r.name+(r.message?' · '+r.message:'')).join('\n');
    document.body.appendChild(div);window.__hanamQA=results;
   }
   try{
    for(let i=0;i<100&&!storageReady;i++)await new Promise(r=>setTimeout(r,80));
    assert(storageReady,'IndexedDB not ready');
    log('IndexedDB open',true);
    const dataBytes=new Uint8Array([137,80,78,71,13,10,26,10,1,2,3,4,5,6]);
    const files=[1,2,3].map(i=>new File([dataBytes,i+''],`qa-${i}.png`,{type:'image/png',lastModified:1729300000000+i}));
    const row={id:sampleId,branchId:BRANCH,kind:'photo',zone:'B',spot:'B-01',title:'QA photos',text:'QA storage test',createdAt:Date.now(),comments:[],files,classificationHistory:[]};
    await commitPost(row);ids.push(sampleId);
    const saved=(await allFrom(db)).find(x=>x.id===sampleId);
    assert(saved?.files?.length===3,'missing 3 files');
    for(let i=0;i<3;i++){
     assert(saved.files[i].name===files[i].name&&saved.files[i].lastModified===files[i].lastModified,'file metadata altered');
     assert(await sha(await saved.files[i].arrayBuffer())===await sha(await files[i].arrayBuffer()),'original bytes altered');
    }
    log('3 files + SHA-256 integrity + metadata',true);
    await updatePost(sampleId,latest=>({...latest,comments:[...(latest.comments||[]),{body:'QA comment',at:Date.now()}]}));
    let rec=(await allFrom(db)).find(x=>x.id===sampleId);
    assert(rec.comments.length===1&&rec.files.length===3,'update lost photo/comment');log('Transactional comment update preserves photos',true);
    await updatePost(sampleId,latest=>({...latest,zone:'C',spot:'C-02',classificationHistory:[...(latest.classificationHistory||[]),{fromZone:latest.zone,toZone:'C',at:Date.now()}]}));
    rec=(await allFrom(db)).find(x=>x.id===sampleId);
    assert(rec.spot==='C-02'&&rec.comments.length===1&&rec.files.length===3,'classification changed content');log('Classification preserves photos/comments',true);
    db.close();db=await openDB(OLD_DB,1);
    rec=(await allFrom(db)).find(x=>x.id===sampleId);
    assert(rec.files.length===3&&rec.comments.length===1,'data lost after db reopen');log('Persist after DB reopen',true);
    const data=await Promise.all(rec.files.map(async f=>({name:f.name,type:f.type,lastModified:f.lastModified,data:await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})})));
    const backup={format:'market-neighbor-v1',branchId:BRANCH,posts:[{...rec,files:data}]};
    const asFile=o=>new File([JSON.stringify(o)],'test-backup.json',{type:'application/json'});
    const count0=(await allFrom(db)).length;
    await importData(asFile(backup));
    const after=(await allFrom(db));
    assert(after.length===count0+1&&after.some(p=>p.id.startsWith('copy-')&&p.title==='QA photos'),'duplicate not preserved');
    for(const p of after)if(p.id!==sampleId&&p.title==='QA photos')ids.push(p.id);
    log('JSON restore preserves duplicate as copy',true);
    const bad=structuredClone(backup);bad.posts[0].comments=[{body:5,at:Date.now()}];
    let rejected=false;try{await importData(asFile(bad))}catch(e){rejected=true}
    assert(rejected&&(await allFrom(db)).length===count0+1,'bad backup changed records');log('Invalid backup rejected atomically',true);
    await reload();assert(photoPosts().some(p=>p.id===sampleId),'feed not refreshed');log('Photo feed reload',true);
    const pageURL=location.href;
    const awaitPop=()=>new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('popstate timeout')),2500);window.addEventListener('popstate',()=>{clearTimeout(t);resolve()},{once:true})});
    openOverlay('upload');assert(ui.overlay==='upload'&&!!document.querySelector('#uploadForm'),'upload popup missing');
    let pop=awaitPop();history.back();await pop;
    assert(ui.overlay===null&&location.href===pageURL,'browser back left app');log('Android-style Back closes upload only',true);
    openOverlay('detail','demoB');assert(ui.overlay==='detail','detail missing');
    pop=awaitPop();history.back();await pop;
    assert(ui.overlay===null&&location.href===pageURL,'detail back left app');log('Back closes detail viewer only',true);
    openOverlay('upload');pop=awaitPop();closeOverlay();closeOverlay();await pop;
    assert(ui.overlay===null&&location.href===pageURL,'double close left app');log('Rapid double close does not navigate away',true);
   }catch(e){log('QA suite execution',false,e.message)}
   finally{for(const id of ids){try{await removePost(id)}catch(e){log('Cleanup '+id,false,e.message)}}
    log('QA posts cleaned',true);saveReport();}
 })();
}
})();
