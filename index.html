<script>
(()=>{'use strict';
const ZONES='ABCDEFGHIJ'.split(''); const DB_NAME='hanam-mobile-design-preview-v1';const STORE='posts';

let ui={page:'feed',zone:'ALL',overlay:null};let lastFocus=null;let toastTimer;
const $=(s,root=document)=>root.querySelector(s);const $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconPin='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
function mockSVG(type){const items=type===0?['#D8DBE5','#D4473D','#E2AE3D','#4B8ABA']:type===1?['#75A94A','#DCB549','#CE5741','#96B35A']:['#5694C6','#91A7BC','#D9AC43','#BD494C'];const tag=type===0?'시식·행사 코너':type===1?'신선식품 코너':'매장 통로';const shelves=Array.from({length:4},(_,r)=>Array.from({length:7},(_,c)=>`<rect x="${20+c*66}" y="${140+r*73}" width="55" height="${46+(c%2)*5}" rx="4" fill="${items[(c+r)%4]}" opacity=".92"/><rect x="${20+c*66}" y="${177+r*73}" width="55" height="10" rx="2" fill="#fff" opacity=".35"/>`).join('')).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff4f8"/><stop offset="1" stop-color="#cedbe9"/></linearGradient></defs><rect width="900" height="600" fill="url(#bg)"/><path d="M0 0H900V390L700 330H190L0 390Z" fill="#dbe4ed"/><path d="M0 600 180 340H720L900 600Z" fill="#b1bfce"/><g transform="translate(45,0)"><rect x="0" y="105" width="490" height="366" rx="6" fill="#f8f9fb" stroke="#99a7b8" stroke-width="9"/>${shelves.replaceAll('x="20','x="20')}<rect x="0" y="95" width="490" height="35" fill="#005DAA"/></g><rect x="600" y="155" width="245" height="250" fill="#f9fbfc" stroke="#a5b1bf" stroke-width="9"/><rect x="600" y="141" width="245" height="35" fill="#E31837"/>${Array.from({length:3},(_,r)=>Array.from({length:3},(_,c)=>`<rect x="${610+c*74}" y="${185+r*68}" width="61" height="52" rx="3" fill="${items[(c+r)%4]}"/>`).join('')).join('')}<rect x="0" y="0" width="900" height="74" fill="#fff" opacity=".94"/><text x="40" y="48" font-family="sans-serif" font-weight="bold" font-size="27" fill="#005DAA">HANAM · ${tag}</text><rect x="267" y="491" width="365" height="56" rx="13" fill="#fff" opacity=".96"/><text x="449" y="527" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#435773">화면 구성 확인용 예시 이미지</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}

function setView(next,push=true){ui={...ui,...next};if(push){try{history.pushState({hanam:true,...ui},'',location.href)}catch(e){/* local file protocol may not support history entries */}}render();window.scrollTo({top:0,behavior:'instant'})}
function nav(page){if(ui.overlay){closeOverlay();return}if(page===ui.page){window.scrollTo({top:0,behavior:'smooth'});return}setView({page,overlay:null})}

function closeOverlay(){if(!ui.overlay)return;const prior=history.state; if(prior?.hanam&&prior.overlay&&history.length>1){history.back()}else{setView({overlay:null},false)} setTimeout(()=>lastFocus?.focus?.(),40)}
window.addEventListener('popstate',e=>{const s=e.state;if(s?.hanam)ui={page:s.page||'feed',zone:s.zone||'ALL',overlay:s.overlay||null};else ui={page:'feed',zone:'ALL',overlay:null};render()});

function renderNav(){$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===ui.page);if(b.dataset.nav===ui.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function renderMain(){const el=$('#main');if(ui.page==='feed'){let shown=[...posts,...demo].filter(p=>ui.zone==='ALL'||p.zone===ui.zone);shown.sort((a,b)=>b.created-a.created);el.innerHTML=`<section class="welcome"><div class="location">${iconPin} 경기 하남 · 하남점 이용자 커뮤니티</div><h1>매장 현황을 <span class="accent">사진으로</span><br>쉽게 확인하세요.</h1><p class="subtext">다녀온 사람이 올리고, 방문할 사람이 확인하는 사진 피드</p><div class="dash"><div class="stat"><b>${posts.length}</b><span>내 브라우저 게시물</span></div><div class="stat"><b>${new Set(posts.map(p=>p.zone)).size}</b><span>등록된 구역</span></div><div class="stat"><b>10</b><span>구역 필터 A~J</span></div></div></section><div class="announcement"><span>ℹ️</span><span><b>디자인 테스트 버전</b> · 아래 예시 카드는 실제 매장 사진이 아닙니다. 등록한 사진은 이 브라우저에만 저장됩니다.</span></div><div class="section-head"><div><h2>오늘의 매장 사진</h2><p>전체 보기 또는 원하는 구역만 선택</p></div><button type="button" class="text-link" data-action="upload">+ 사진 공유</button></div><div class="filter-wrap"><div class="filters">${['ALL',...ZONES].map(z=>`<button class="filter ${ui.zone===z?'active':''}" data-zone="${z}" aria-pressed="${ui.zone===z}">${z==='ALL'?'모두 보기':z+'구역'}</button>`).join('')}</div></div><div class="feed">${shown.length?shown.map(postHTML).join(''):''}</div>${!shown.length?'<div class="empty"><div class="symbol">📷</div><b>이 구역에 등록된 사진이 없어요</b><p>첫 사진을 올려 매장 소식을 공유해 보세요.</p><button class="primary blue" data-action="upload">사진 올리기</button></div>':''}<div class="notice">본 서비스는 매장 운영사와 무관한 비공식 커뮤니티 시안입니다. 구역 A~J는 테스트용 구분입니다.</div>`}
else if(ui.page==='zones'){el.innerHTML=`<section class="welcome"><div class="location">${iconPin} ZONE DIRECTORY</div><h1>구역별로 <span class="accent">골라 보기</span></h1><p class="subtext">원하는 구역을 누르면 해당 사진만 볼 수 있습니다.</p><div class="accent-rule"></div></section><div class="section-head"><div><h2>A~J 구역 탐색</h2><p>현재 테스트용 구역 구분</p></div></div><div class="zones-grid">${ZONES.map(z=>`<button class="zone-card" data-zone-go="${z}"><span class="zone-label"><span class="zone-letter">${z}</span><span><strong>${z} 구역</strong><small>${countZone(z)}장 등록</small></span></span><span style="color:#9eafbf;font-size:20px">›</span></button>`).join('')}</div><div class="notice">실제 매장 동선 및 구역 위치를 의미하지 않습니다. 추후 확인된 구역도로 대체 예정입니다.</div>`}
else{el.innerHTML=`<section class="welcome"><div class="location">${iconPin} COMMUNITY GUIDE</div><h1>하남점 커뮤니티 <span class="accent">이용 안내</span></h1><p class="subtext">처음 이용할 때 꼭 알아두면 좋은 내용입니다.</p></section><div class="guide"><div class="guide-card"><h3>📷 사진 등록</h3><p>하단의 빨간 <b>사진 올리기</b> 버튼을 눌러 사진을 선택하고 A~J 구역을 지정하세요. 사진 여러 장을 한 번에 선택할 수 있습니다.</p></div><div class="guide-card"><h3>🧭 구역별 보기</h3><p>메인 화면의 <b>모두 보기</b>가 기본값입니다. 특정 구역을 눌러 해당 구역 사진만 확인할 수 있습니다.</p></div><div class="guide-card"><h3>↩️ 갤럭시 뒤로가기</h3><p>업로드·상세 화면에서 휴대전화 뒤로가기를 누르면 앱 전체를 나가는 대신 이전 화면으로 돌아가도록 화면 이동 기록을 관리합니다.</p></div><div class="guide-card"><h3>🔒 데이터 저장 안내</h3><p>이번 디자인 테스트는 이 브라우저의 IndexedDB에 사진을 저장합니다. 다른 기기와 공유되지 않으며 브라우저 데이터 삭제 시 사진도 삭제될 수 있습니다. 기존 v0.2.1 사이트의 사진 데이터와는 별개입니다.</p></div><div class="guide-card"><h3>🛒 비공식 커뮤니티</h3><p>본 앱은 코스트코가 운영하거나 후원하는 공식 서비스가 아닙니다. 브랜드를 연상시키는 레드·블루 색상을 사용한 독립 커뮤니티 디자인 시안입니다.</p></div></div>`} }
function postHTML(p){const image=p.isDemo?p.src:photoUrl(p);return `<article class="post"><div class="post-head"><div class="post-head-left"><div class="avatar">${esc(p.zone)}</div><div><b>${p.isDemo?'예시 게시물':'내 브라우저 등록'}</b><small>${esc(p.spot||p.zone+'구역')} · ${formatTime(p.created)}</small></div></div><span class="zbadge">${esc(p.zone)}구역</span></div><button class="media-open" data-detail="${esc(p.id)}" aria-label="${esc(p.title)} 사진 상세 열기"><img class="photo" src="${image}" alt="${esc(p.title)}" loading="lazy"><span class="zoom-hint">⊕ 사진 자세히</span>${p.isDemo?'<span class="sample-sticker">샘플 이미지</span>':''}</button><div class="post-body"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div><div class="post-foot"><span>📍 ${esc(p.zone)}구역 · ${esc(p.spot||'위치 미지정')}</span><button class="foot-button" data-detail="${esc(p.id)}">자세히 보기 →</button></div></article>`}
const urlCache=new Map();function photoUrl(p){if(!p.blob)return '';if(!urlCache.has(p.id))urlCache.set(p.id,URL.createObjectURL(p.blob));return urlCache.get(p.id)}
function cleanupURL(id){let url=urlCache.get(id);if(url){URL.revokeObjectURL(url);urlCache.delete(id)}}
function renderOverlay(){const root=$('#overlay'),sheet=$('#sheet');root.classList.toggle('show',Boolean(ui.overlay));root.classList.toggle('lightbox',ui.overlay==='detail');if(!ui.overlay){sheet.innerHTML='';cleanupSelectedFiles();return}if(ui.overlay==='upload'){sheet.setAttribute('aria-label','사진 올리기');sheet.innerHTML=`<div class="sheet-title"><h2>사진 올리기</h2><button class="close" type="button" data-action="close" aria-label="닫기">✕</button></div><form id="uploadForm" class="sheet-form"><div class="field"><label for="files">매장 사진 <em>*</em></label><div class="filebox"><strong>📷 사진 선택 또는 촬영</strong><small>최대 5장 · 사진 한 장당 20MB 이하</small><input id="files" name="files" type="file" accept="image/*" multiple required aria-label="사진 선택"></div><div class="preview-strip" id="filePreviews"></div></div><div class="field"><label for="zone">구역 선택 <em>*</em></label><select name="zone" id="zone" required><option value="">구역을 선택해 주세요</option>${ZONES.map(z=>`<option value="${z}">${z}구역</option>`).join('')}</select></div><div class="field"><label for="spot">위치 / 스팟 (선택)</label><input id="spot" name="spot" placeholder="예: 통로 끝, 행사 매대" maxlength="60"></div><div class="field"><label for="title">게시물 제목 <em>*</em></label><input id="title" name="title" placeholder="예: 오늘 신선식품 코너" maxlength="70" required></div><div class="field"><label for="memo">사진 설명</label><textarea id="memo" name="memo" placeholder="다른 이용자에게 도움이 되는 정보를 적어 주세요." maxlength="500"></textarea></div><div class="alert">🔒 테스트 사진은 서버로 전송하지 않으며 현재 브라우저에만 저장됩니다. 실제 서비스에 올리기 전 개인정보·타인의 얼굴 등이 노출되는지 확인해 주세요.</div><div class="form-foot"><button class="secondary" type="button" data-action="close">취소</button><button class="primary" type="submit">사진 등록하기</button></div></form>`;return}
const p=[...posts,...demo].find(x=>x.id===currentDetailId);if(!p){setView({overlay:null},false);return}sheet.setAttribute('aria-label','사진 상세 보기');sheet.innerHTML=`<div class="sheet-title"><h2>사진 상세</h2><button class="close" type="button" data-action="close" aria-label="닫기">✕</button></div><div class="detail-area"><img class="detail-photo" src="${p.isDemo?p.src:photoUrl(p)}" alt="${esc(p.title)}"><div class="detail-info"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><div class="detail-meta">${esc(p.zone)}구역 · ${esc(p.spot||'위치 미지정')} · ${formatTime(p.created)}${p.isDemo?' · 샘플 이미지':''}</div>${!p.isDemo?`<button class="remove" data-delete="${esc(p.id)}">내 게시물 삭제</button>`:''}</div></div>`}
function cleanupSelectedFiles(){selectedPreviews.forEach(x=>URL.revokeObjectURL(x));selectedPreviews=[];selectedFiles=[]}
function handleFiles(input){cleanupSelectedFiles();let arr=[...input.files];if(arr.length>5){notify('한 번에 최대 5장만 선택할 수 있습니다.');input.value='';return}if(arr.some(f=>!f.type.startsWith('image/')||f.size>20*1024*1024)){notify('20MB 이하 이미지 파일만 등록할 수 있습니다.');input.value='';return}selectedFiles=arr;selectedPreviews=arr.map(f=>URL.createObjectURL(f));$('#filePreviews').innerHTML=selectedPreviews.map(u=>`<img src="${u}" alt="선택한 사진 미리보기">`).join('')}
async function savePost(p){if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(p);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function removePost(id){if(db)await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});posts=posts.filter(x=>x.id!==id);cleanupURL(id)}
async function submitUpload(form){if(!selectedFiles.length){notify('등록할 사진을 선택해 주세요.');return}const zone=form.elements.namedItem('zone').value,title=form.elements.namedItem('title').value.trim(),spot=form.elements.namedItem('spot').value.trim(),text=form.elements.namedItem('memo').value.trim();if(!ZONES.includes(zone)||!title){notify('구역과 제목을 확인해 주세요.');return}const btn=$('[type="submit"]',form);btn.disabled=true;btn.textContent='사진 저장 중…';try{const created=Date.now(),count=selectedFiles.length;for(let i=0;i<selectedFiles.length;i++){const f=selectedFiles[i];const p={id:'photo-'+created+'-'+i+'-'+Math.random().toString(36).slice(2,9),zone,title,spot,text,created:created+i,blob:f,isDemo:false};await savePost(p);posts.unshift(p)}cleanupSelectedFiles();setView({page:'feed',zone:'ALL',overlay:null},false);try{history.replaceState({hanam:true,...ui},'',location.href)}catch(e){}notify(`${count}장 등록 완료 · ${db?'이 브라우저에 저장됨':'현재 화면에 임시 등록됨'}`)}catch(e){notify('사진 저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.');btn.disabled=false;btn.textContent='다시 등록하기'}}
async function initDB(){if(!('indexedDB'in window)){persist=false;notify('이 브라우저는 저장 기능을 지원하지 않습니다.');return}try{db=await new Promise((res,rej)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});posts=await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});posts.sort((a,b)=>b.created-a.created)}catch(e){db=null;persist=false;notify('저장소를 열 수 없어 사진이 임시 보관됩니다.')}render()}
$('#app').addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.nav){nav(t.dataset.nav);return}if(t.dataset.action==='upload'){openOverlay('upload');return}if(t.dataset.action==='close'){closeOverlay();return}if(t.dataset.zone){setView({zone:t.dataset.zone});return}if(t.dataset.zoneGo){setView({page:'feed',zone:t.dataset.zoneGo});return}if(t.dataset.detail){openOverlay('detail',t.dataset.detail);return}if(t.dataset.delete){if(!confirm('이 브라우저에서 등록한 사진을 삭제할까요?'))return;try{await removePost(t.dataset.delete);setView({overlay:null},false);try{history.replaceState({hanam:true,...ui},'',location.href)}catch(e){}notify('사진을 삭제했습니다.')}catch{notify('삭제에 실패했습니다.')}return}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeOverlay()});
$('#overlay').addEventListener('change',e=>{if(e.target.id==='files')handleFiles(e.target)});
$('#overlay').addEventListener('submit',e=>{if(e.target.id==='uploadForm'){e.preventDefault();submitUpload(e.target)}});
try{history.replaceState({hanam:true,...ui},'',location.href)}catch(e){}render();initDB();
})();
</script>
</body>
</html>
