function fillSpotOptions(selected){const z=$('#sheet #zone')?.value,s=$('#sheet #spot');if(!z||!s)return;s.innerHTML=[1,2].map(n=>{let id=z+'-0'+n;return `<option value="${id}" ${selected===id?'selected':''}>${id} · 임시 스팟 ${n}</option>`}).join('')}

function handleFileChange(input){clearSelection();const arr=[...(input.files||[])];if(arr.length>10||arr.some(f=>f.size>20*1024*1024||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(f.type))){toast('사진 1~10장, 장당 20MB 이하 JPG·PNG·WebP·HEIC만 가능합니다.');input.value='';return}selectedFiles=arr;previews=arr.map(f=>URL.createObjectURL(f));const box=$('#filePreviews');if(box)box.innerHTML=previews.map(u=>`<img src="${u}" alt="선택 사진 미리보기"/>`).join('')}
function openDB(name,version){return new Promise((res,rej)=>{const req=indexedDB.open(name,version);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function allFrom(database){return new Promise((res,rej)=>{const tx=database.transaction(STORE,'readonly');let rows=[];const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>rows=r.result||[];tx.oncomplete=()=>res(rows);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('조회 중단'))})}
function commitPost(p,overwrite=false){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');let store=tx.objectStore(STORE);(overwrite?store.put(p):store.add(p));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('저장 중단'))})}
function removePost(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('삭제 중단'))})}
async function reload(){posts=(await allFrom(db)).filter(p=>p.branchId===BRANCH&&['photo','story'].includes(p.kind)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render()}
async function migratePreview(){if(!('indexedDB' in window))return;let r;try{r=await new Promise((resolve,reject)=>{let q=indexedDB.open(PREVIEW_DB);q.onupgradeneeded=()=>q.transaction.abort();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}catch{return}if(!r.objectStoreNames.contains(STORE)){r.close();return}try{let old=await allFrom(r),existing=new Set((await allFrom(db)).map(p=>p.id));for(const p of old){const id='preview-'+p.id;if(existing.has(id))continue;if(!p.blob||!ZONES.some(([z])=>z===p.zone))continue;const file=new File([p.blob],p.blob.name||'preview-photo',{type:p.blob.type||'image/jpeg',lastModified:p.blob.lastModified||Date.now()});await commitPost({id,branchId:BRANCH,kind:'photo',zone:p.zone,spot:spotValid(p.zone,p.spot)?p.spot:p.zone+'-01',title:String(p.title||'').slice(0,70),text:String(p.text||'').slice(0,800),createdAt:p.created||Date.now(),files:[file],comments:[],classificationHistory:[],originPreview:true});existing.add(id)}}finally{r.close()}}
async function exportData(){const records=posts;const rows=[];for(const p of records){let files=[];for(const f of (p.files||[])){if(!(f instanceof Blob))continue;const data=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(f)});files.push({name:f.name||'photo',type:f.type||'image/jpeg',lastModified:f.lastModified||Date.now(),data})}rows.push({...p,files})}const blob=new Blob([JSON.stringify({format:'market-neighbor-v1',branchId:BRANCH,exportedAt:Date.now(),posts:rows})],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`hanam-backup-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(`게시물 ${rows.length}개의 백업을 저장했습니다.`)}
function validDate(t){return Number.isFinite(+t)&&+t>0&&+t<4102444800000}
async function importData(file){
if(file.size>200*1024*1024)throw Error('백업 파일이 너무 큽니다.');
const data=JSON.parse(await file.text());
if(data.branchId!==BRANCH||!Array.isArray(data.posts)||data.format!=='market-neighbor-v1')throw Error('하남점 백업 형식(v0.1/v0.2 호환형)이 아닙니다.');
if(data.posts.length>500)throw Error('최대 500개의 게시물만 가져올 수 있습니다.');
const existing=new Set((await allFrom(db)).map(p=>p.id)),ready=[];
// Parse and validate every item before writing any new data.
for(const row of data.posts){
  if(!row||!['photo','story'].includes(row.kind)||typeof row.id!=='string'||!row.id||!validDate(row.createdAt))throw Error('백업에 잘못된 게시물이 포함되어 있습니다.');
  if(row.branchId&&row.branchId!==BRANCH)throw Error('다른 지점의 게시물은 가져올 수 없습니다.');
  const zone=row.kind==='photo'?(typeof row.zone==='string'&&row.zone?row.zone:'A'):null;
  const spot=row.kind==='photo'?(typeof row.spot==='string'&&row.spot?row.spot:zone+'-01'):null;
  if(row.kind==='photo'&&zoneMap[zone]&&spot&&/^[A-J]-\d{2}$/.test(spot)&&!spotValid(zone,spot))throw Error('다른 구역에 속한 스팟이 있습니다.');
  if(row.comments!==undefined&&(!Array.isArray(row.comments)||row.comments.some(c=>!c||typeof c.body!=='string'||!validDate(c.at))))throw Error('잘못된 댓글이 포함되어 있습니다.');
  let files=[];
  if(row.kind==='photo'){
    if(!Array.isArray(row.files)||row.files.length<1||row.files.length>10)throw Error('사진 개수가 올바르지 않습니다.');
    for(const f of row.files){
      if(!f||typeof f.data!=='string'||!/^data:image\/(jpeg|png|webp|heic|heif);base64,/i.test(f.data))throw Error('손상되었거나 지원되지 않는 사진이 있습니다.');
      const blob=await(await fetch(f.data)).blob();if(blob.size>20*1024*1024)throw Error('20MB 초과 사진이 있습니다.');
      files.push(new File([blob],String(f.name||'photo').slice(0,120),{type:blob.type,lastModified:validDate(f.lastModified)?Number(f.lastModified):Date.now()}));
    }
  }
  const rec={...row,id:row.id,branchId:BRANCH,zone,spot,comments:Array.isArray(row.comments)?row.comments:[],files,classificationHistory:Array.isArray(row.classificationHistory)?row.classificationHistory:[]};
  while(existing.has(rec.id))rec.id='copy-'+uid();existing.add(rec.id);ready.push(rec);
}
// One IndexedDB transaction ensures an invalid/failed write never leaves a partial import.
if(ready.length)await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite');const store=tx.objectStore(STORE);
  for(const r of ready)store.add(r);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('복원이 중단되었습니다.'));
});
await reload();toast(`백업 ${ready.length}개를 기존 데이터에 추가했습니다. (덮어쓰기 없음)`);
}
async function addPost(form,kind){const data=new FormData(form),title=String(data.get('title')||'').trim().slice(0,70),text=String(data.get('memo')||'').trim().slice(0,800),zone=String(data.get('zone')||'A'),spot=String(data.get('spot')||'A-01');if(!title||kind==='story'&&!text)throw Error('제목과 내용을 확인해 주세요.');if(kind==='photo'&&(!selectedFiles.length||selectedFiles.length>10||!spotValid(zone,spot)))throw Error('사진과 스팟을 확인해 주세요.');if(!data.get('rights'))throw Error('게시 권한을 확인해 주세요.');let p={id:uid(),branchId:BRANCH,kind,title,text,zone:kind==='photo'?zone:null,spot:kind==='photo'?spot:null,createdAt:Date.now(),comments:[],files:kind==='photo'?[...selectedFiles]:[],classificationHistory:[]};await commitPost(p);await reload();closeOverlay();toast('현재 브라우저에 저장했습니다.');if(kind==='story'){setTimeout(()=>route({page:'stories',zone:'ALL',spot:'ALL',overlay:null}),60)}}
async function editClassification(form){const p=posts.find(p=>p.id===activeId);if(!p)throw Error('게시물을 찾을 수 없습니다.');const data=new FormData(form),z=String(data.get('zone')),s=String(data.get('spot'));if(!spotValid(z,s))throw Error('선택한 구역의 스팟을 지정해 주세요.');if(p.zone!==z||p.spot!==s){const rec={...p,zone:z,spot:s,classificationHistory:[...(p.classificationHistory||[]),{fromZone:p.zone,fromSpot:p.spot,toZone:z,toSpot:s,at:Date.now()}]};await commitPost(rec,true);await reload()}closeOverlay();toast('분류가 저장되었습니다. 사진 원본은 그대로입니다.')}
async function handleAction(action){if(action==='upload'||action==='story'){openOverlay(action==='story'?'story':'upload');return}if(action==='close'){closeOverlay();return}if(action==='prev'||action==='next'){const p=posts.find(x=>x.id===activeId)||demo.find(x=>x.id===activeId);if(p){picIndex=Math.min(Math.max(0,picIndex+(action==='next'?1:-1)),p.files.length-1);zoom=1;renderOverlay()}return}if(action==='zoom-in'||action==='zoom-out'){zoom=Math.min(3,Math.max(1,Math.round((zoom+(action==='zoom-in'?.5:-.5))*10)/10));renderOverlay();return}if(action==='classify'){route({overlay:'classify'});return}if(action==='delete'){if(!confirm('이 기기에서 사진 게시물을 삭제할까요?'))return;await removePost(activeId);await reload();closeOverlay();toast('삭제했습니다.');return}if(action==='export'){await exportData();return}if(action==='import'){$('#importFile')?.click();return}if(action==='text-size'){large=!large;try{localStorage.setItem('hanam-large-text',large?'1':'0')}catch{}render();return}if(action==='speak'){if(!('speechSynthesis' in window)){toast('현재 브라우저에서 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance('하남점 커뮤니티입니다. 사진 피드에서 전체 또는 A부터 J 구역을 선택할 수 있습니다. 구역 보기에는 20개 임시 촬영 스팟이 있습니다. 하단 버튼에서 사진과 이야기를 등록하세요. 데이터는 이 기기에 보관됩니다.');utt.lang='ko-KR';utt.rate=.85;speechSynthesis.speak(utt)}}
$('#app').addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;try{if(btn.dataset.nav){nav(btn.dataset.nav);return}if(btn.dataset.zone){route({zone:btn.dataset.zone,spot:'ALL'});return}if(btn.dataset.zoneGo){route({page:'feed',zone:btn.dataset.zoneGo,spot:'ALL'});return}if(btn.dataset.spot){route({spot:btn.dataset.spot});return}if(btn.dataset.detail){openOverlay('detail',btn.dataset.detail);return}if(btn.dataset.comments){$('#comments-'+CSS.escape(btn.dataset.comments))?.classList.toggle('hidden');return}if(btn.dataset.storyDelete){if(!confirm('이 브라우저의 이웃 이야기를 삭제할까요?'))return;await removePost(btn.dataset.storyDelete);await reload();toast('이야기를 삭제했습니다.');return}if(btn.dataset.action)await handleAction(btn.dataset.action)}catch(err){console.error(err);toast(err.message||'동작 중 오류가 발생했습니다.')}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeOverlay()});
$('#overlay').addEventListener('change',e=>{if(e.target.id==='files')handleFileChange(e.target);if(e.target.id==='zone')fillSpotOptions()});
$('#overlay').addEventListener('submit',async e=>{if(!['uploadForm','classForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,btn=form.querySelector('[type=submit]');btn.disabled=true;try{if(form.id==='classForm')await editClassification(form);else await addPost(form,ui.overlay)}catch(err){console.error(err);let box=$('#formError');if(box)box.textContent=err.message||'저장하지 못했습니다.';btn.disabled=false}});
$('#main').addEventListener('submit',async e=>{let form=e.target.closest('[data-comment]');if(!form)return;e.preventDefault();const p=posts.find(p=>p.id===form.dataset.comment);if(!p)return;let text=String(new FormData(form).get('comment')||'').trim();if(!text)return;try{let copy={...p,comments:[...(p.comments||[]),{body:text.slice(0,250),at:Date.now()}]};await commitPost(copy,true);await reload();$('#comments-'+CSS.escape(p.id))?.classList.remove('hidden');toast('댓글을 저장했습니다.')}catch(err){toast(err.message||'댓글 저장 실패')}});
$('#main').addEventListener('change',e=>{if(e.target.id==='importFile'){let f=e.target.files?.[0];if(!f)return;e.target.value='';if(!confirm('백업 파일의 게시물을 현재 기기에 추가합니다. 같은 ID의 게시물은 사본으로 보존합니다. 진행할까요?'))return;importData(f).catch(err=>toast('백업 오류: '+err.message))}});
window.addEventListener('beforeunload',()=>{for(const u of trackedURLs)URL.revokeObjectURL(u)});
try{large=localStorage.getItem('hanam-large-text')==='1'}catch{}
try{history.replaceState({hanam:true,...ui},'',location.href)}catch{}
render();(async()=>{try{db=await openDB(OLD_DB,1);await migratePreview();await reload()}catch(err){console.error(err);toast('기기 저장소에 접근할 수 없습니다. Chrome 또는 삼성 인터넷을 확인해 주세요.')}})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
